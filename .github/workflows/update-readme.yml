name: Update README Last Updated

on:
  schedule:
    - cron: '0 0 * * *'  # runs every day at midnight UTC
  workflow_dispatch:       # allows manual trigger from GitHub Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set last updated date
        run: |
          DATE=$(TZ='Asia/Jakarta' date +'%d %B %Y')
          DATE_ENCODED=$(echo "$DATE" | sed 's/ /%20/g')
          sed -i "s|<!-- LAST_UPDATED -->|$DATE_ENCODED|g" README.md

      - name: Commit and push if changed
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update last updated date"
          git push
